name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # R is not on the runner by default, and the R effect analyser is a
      # real part of the plugin. Without this the R tests announce a skip and
      # nothing checks them.
      - name: Install R
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y r-base

      # The PDF extractor test builds a document with matplotlib and reads it
      # back with whichever PDF library is installed. pymupdf is the first one
      # the extractor tries.
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install matplotlib pymupdf

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      # The whole gate in one step, so CI fails for the same reason a
      # contributor's machine would: the audit, the type check, every test
      # suite, the module load, and the install into a plugin directory.
      - name: Run the full verification
        run: npm run verify

      - name: Check the vendored skills are unmodified
        # The vendored skills are byte-identical copies of upstream. If a
        # vendored file was edited in place rather than through the
        # load-time adaptation, the next sync would silently discard the
        # change — so it fails the build here instead.
        run: |
          if [ ! -f upstream.lock.json ]; then
            echo "upstream.lock.json is missing" >&2
            exit 1
          fi
          node --experimental-strip-types scripts/check-vendor.mjs

      - name: Upload the test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: |
            .opencode-science/
          retention-days: 7
          if-no-files-found: ignore
